name: Publish EMST v0.3.0 to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: emst-pypi-0.3.0
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Source used for the reviewed PyPI candidates.
          ref: c819b977929a6432dd22650802eb0e64cf1698c7
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release identity
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "emst-cyprus"
          assert project["version"] == "0.3.0"
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python -m pip install "dist/emst_cyprus-0.3.0-py3-none-any.whl[audit]"
          python -m pip check
          python v0.3/examples/library_day.py --output /tmp/emst-pypi-daily
      - uses: actions/upload-artifact@v7
        with:
          name: emst-pypi-0.3.0
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emst-cyprus/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: emst-pypi-0.3.0
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
