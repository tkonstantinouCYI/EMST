name: Publish EMST to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: emst-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release identity
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "emst-cyprus"
          print("Release version:", project["version"])
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          wheel, = Path("dist").glob("*.whl")
          subprocess.run([sys.executable, "-m", "pip", "install", str(wheel) + "[audit,dataframes]"], check=True)
          PY
          python -m pip check
          cd /tmp
          python "$GITHUB_WORKSPACE/examples/library_day.py" --output /tmp/emst-pypi-daily
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests"
      - uses: actions/upload-artifact@v7
        with:
          name: emst-pypi
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emst-cyprus/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: emst-pypi
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
