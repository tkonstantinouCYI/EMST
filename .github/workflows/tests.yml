name: Library regression tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
        highs: ['1.15.1', '1.16.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[audit,dataframes]"
      - run: python -m pip install highspy==${{ matrix.highs }}
      - run: python tools/run_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}-highs-${{ matrix.highs }}
          path: output/unit-tests-*
