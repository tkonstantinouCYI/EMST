[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emst-cyprus"
version = "0.3.0"
description = "Isolated Cyprus electricity market simulation and auditable settlement"
requires-python = ">=3.11"
dependencies = ["pulp>=3.3,<4", "tzdata>=2025.2; platform_system == 'Windows'"]

[project.optional-dependencies]
audit = ["highspy>=1.12,<2"]
dataframes = ["pandas>=2.2,<4"]

[project.scripts]
emst-cyprus = "emst_v03.runner:main"

[tool.setuptools.packages.find]
include = ["emst_v03*"]
